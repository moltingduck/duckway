{{define "content"}}
<div class="page-header">
  <h1>Request Log</h1>
</div>

<div class="card">
  <div class="flex gap-md mb-1" style="flex-wrap:wrap">
    <div class="form-group" style="flex:1;min-width:150px">
      <label>Service</label>
      <select id="f-service" onchange="onFilterChange()">
        <option value="">All services</option>
      </select>
    </div>
    <div class="form-group" style="flex:1;min-width:150px">
      <label>Client</label>
      <select id="f-client" onchange="onFilterChange()">
        <option value="">All clients</option>
      </select>
    </div>
    <div class="form-group" style="flex:1;min-width:120px">
      <label>Key</label>
      <select id="f-key" onchange="onFilterChange()">
        <option value="">All keys</option>
      </select>
    </div>
    <div class="form-group" style="flex:1;min-width:100px">
      <label>Method</label>
      <select id="f-method" onchange="onFilterChange()">
        <option value="">All</option>
        <option>GET</option><option>POST</option><option>PUT</option><option>PATCH</option><option>DELETE</option>
      </select>
    </div>
    <div class="form-group" style="flex:1;min-width:100px">
      <label>Status</label>
      <select id="f-status" onchange="onFilterChange()">
        <option value="">All</option>
        <option value="ok">2xx OK</option>
        <option value="err">4xx/5xx Error</option>
      </select>
    </div>
    <div class="form-group" style="flex:1;min-width:120px">
      <label>Search path</label>
      <input type="text" id="f-path" placeholder="/v1/chat/..." oninput="onFilterChange()">
    </div>
  </div>
  <div class="flex-between mb-1">
    <span id="log-count" class="text-muted text-sm"></span>
    <div class="flex gap-sm" style="align-items:center">
      <label class="text-sm text-muted" for="f-perpage">Per page</label>
      <select id="f-perpage" onchange="onPerPageChange()" style="width:auto">
        <option value="15">15</option>
        <option value="30">30</option>
        <option value="50">50</option>
        <option value="100">100</option>
      </select>
      <button class="btn btn-sm" onclick="loadLogs()">Refresh</button>
    </div>
  </div>

  <table>
    <thead>
      <tr>
        <th>Time</th>
        <th>Client</th>
        <th>Service</th>
        <th>Key</th>
        <th>Method</th>
        <th>Path</th>
        <th>Status</th>
      </tr>
    </thead>
    <tbody id="log-body"></tbody>
  </table>
  <div id="log-pager" class="pagination" style="display:none"></div>
</div>

<script>
var allLogs = [];
var currentPage = 1;
var perPage = 15;

function loadLogs() {
  fetch('/api/logs', {credentials:'same-origin'})
    .then(function(r) {
      if (r.status === 401) { window.location = '/admin/login'; return; }
      return r.json();
    })
    .then(function(data) {
      if (!data) return;
      allLogs = data;
      currentPage = 1;
      buildFilterOptions();
      applyFilters();
    });
}

function onPerPageChange() {
  perPage = parseInt(document.getElementById('f-perpage').value, 10) || 15;
  currentPage = 1;
  applyFilters();
}

// Any filter change resets pagination back to page 1.
function onFilterChange() {
  currentPage = 1;
  applyFilters();
}

function goToPage(p) {
  currentPage = p;
  applyFilters();
  // Scroll the table back to the top so the user sees the new page from row 1
  document.getElementById('log-body').scrollIntoView({behavior:'smooth', block:'start'});
}

function buildFilterOptions() {
  var services = {}, clients = {}, keys = {};
  allLogs.forEach(function(l) {
    services[l.service_name] = true;
    if (l.client_name) clients[l.client_name] = true;
    if (l.env_name) keys[l.env_name] = true;
  });

  fillSelect('f-service', services, 'All services');
  fillSelect('f-client', clients, 'All clients');
  fillSelect('f-key', keys, 'All keys');
}

function fillSelect(id, obj, allLabel) {
  var sel = document.getElementById(id);
  var current = sel.value;
  sel.innerHTML = '<option value="">' + allLabel + '</option>';
  Object.keys(obj).sort().forEach(function(k) {
    var opt = document.createElement('option');
    opt.value = k;
    opt.textContent = k;
    if (k === current) opt.selected = true;
    sel.appendChild(opt);
  });
}

function applyFilters() {
  var fService = document.getElementById('f-service').value;
  var fClient = document.getElementById('f-client').value;
  var fKey = document.getElementById('f-key').value;
  var fMethod = document.getElementById('f-method').value;
  var fStatus = document.getElementById('f-status').value;
  var fPath = document.getElementById('f-path').value.toLowerCase();

  var filtered = allLogs.filter(function(l) {
    if (fService && l.service_name !== fService) return false;
    if (fClient && l.client_name !== fClient) return false;
    if (fKey && l.env_name !== fKey) return false;
    if (fMethod && l.method !== fMethod) return false;
    if (fStatus === 'ok' && l.status_code >= 400) return false;
    if (fStatus === 'err' && l.status_code < 400) return false;
    if (fPath && l.path.toLowerCase().indexOf(fPath) < 0) return false;
    return true;
  });

  // Clamp current page to a valid range for the new filtered set
  var totalPages = Math.max(1, Math.ceil(filtered.length / perPage));
  if (currentPage > totalPages) currentPage = totalPages;
  if (currentPage < 1) currentPage = 1;

  var start = (currentPage - 1) * perPage;
  var end = Math.min(start + perPage, filtered.length);
  var page = filtered.slice(start, end);

  document.getElementById('log-count').textContent =
    filtered.length === 0
      ? '0 of ' + allLogs.length + ' requests'
      : 'Showing ' + (start + 1) + '–' + end + ' of ' + filtered.length + ' (filtered from ' + allLogs.length + ')';

  var tbody = document.getElementById('log-body');
  tbody.innerHTML = '';

  if (filtered.length === 0) {
    tbody.innerHTML = '<tr><td colspan="7" class="text-muted">No matching requests.</td></tr>';
    renderPager(filtered.length, totalPages);
    return;
  }

  page.forEach(function(l) {
    var tr = document.createElement('tr');
    var statusBadge = '';
    if (l.status_code) {
      var cls = l.status_code < 400 ? 'badge-green' : 'badge-red';
      statusBadge = '<span class="badge ' + cls + '">' + l.status_code + '</span>';
    }
    tr.innerHTML =
      '<td class="text-muted text-sm" style="white-space:nowrap">' + formatTime(l.created_at) + '</td>' +
      '<td>' + (l.client_name || '<span class="text-muted">—</span>') + '</td>' +
      '<td><span class="badge badge-blue">' + l.service_name + '</span></td>' +
      '<td class="text-sm">' + (l.env_name || '<span class="text-muted">—</span>') + '</td>' +
      '<td><span class="badge badge-blue">' + l.method + '</span></td>' +
      '<td class="mono text-sm">' + l.path + '</td>' +
      '<td>' + statusBadge + '</td>';
    tbody.appendChild(tr);
  });

  renderPager(filtered.length, totalPages);
}

// Render Prev / [pages] / Next pagination controls.
function renderPager(filteredCount, totalPages) {
  var pager = document.getElementById('log-pager');
  if (totalPages <= 1) {
    pager.style.display = 'none';
    pager.innerHTML = '';
    return;
  }
  pager.style.display = '';
  pager.innerHTML = '';

  function makeBtn(label, page, opts) {
    opts = opts || {};
    var b = document.createElement('button');
    b.className = 'btn btn-sm' + (opts.active ? ' btn-primary' : '');
    b.textContent = label;
    if (opts.disabled) {
      b.disabled = true;
    } else {
      b.onclick = function() { goToPage(page); };
    }
    return b;
  }

  pager.appendChild(makeBtn('‹ Prev', currentPage - 1, {disabled: currentPage <= 1}));

  // Page-number window: always show 1, last, current ±2; ellipsis for gaps.
  var pages = [];
  var add = function(p) { if (p >= 1 && p <= totalPages && pages.indexOf(p) === -1) pages.push(p); };
  add(1);
  for (var i = currentPage - 2; i <= currentPage + 2; i++) add(i);
  add(totalPages);
  pages.sort(function(a, b) { return a - b; });

  var prev = 0;
  pages.forEach(function(p) {
    if (p - prev > 1) {
      var span = document.createElement('span');
      span.className = 'text-muted';
      span.style.padding = '0 0.25rem';
      span.textContent = '…';
      pager.appendChild(span);
    }
    pager.appendChild(makeBtn(String(p), p, {active: p === currentPage}));
    prev = p;
  });

  pager.appendChild(makeBtn('Next ›', currentPage + 1, {disabled: currentPage >= totalPages}));
}

function formatTime(ts) {
  if (!ts) return '';
  // SQLite format: 2026-04-14 03:32:06
  var parts = ts.split(' ');
  if (parts.length === 2) {
    return '<span class="text-muted">' + parts[0] + '</span> ' + parts[1];
  }
  return ts;
}

document.addEventListener('DOMContentLoaded', loadLogs);
</script>
{{end}}

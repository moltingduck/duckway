{{define "content"}}
<div class="wz-crumbs">
  <nav aria-label="Breadcrumb" class="wz-crumb"><a href="/admin/clients">Clients</a><span aria-hidden="true" class="wz-sep">/</span><span aria-current="page">Add client</span></nav>
  <span class="wz-draftnote" id="wz-draftnote" role="status">Not saved yet</span>
  <button type="button" class="btn btn-sm wz-discard-btn" id="wz-discard-btn" data-action="askDiscard" data-id="" hidden>Discard draft</button>
</div>

<section class="card wz-resume" id="wz-resume" aria-labelledby="wz-resume-h" hidden>
  <h2 id="wz-resume-h" class="wz-resume-h">Resume a draft</h2>
  <p class="text-muted text-sm">These clients were started but not finished. They have no token and cannot connect until you reach the Install step.</p>
  <ul class="wz-drafts" id="wz-resume-list"></ul>
</section>

<div class="wz-layout" id="wz-layout">
  <div class="wz-stepwrap">
    <p class="wz-compact" id="wz-compact" aria-hidden="true"></p>
    <ol class="wz-steps" id="wz-steps" aria-label="Steps"></ol>
  </div>
  <section class="card wz-card" aria-labelledby="wz-title">
    <div id="wz-body" class="wz-body"><p class="text-muted">Loading&hellip;</p></div>
    <div class="wz-foot" id="wz-foot"></div>
  </section>
</div>

<div id="wz-discard-modal" class="modal-backdrop wz-dlg" hidden>
  <div class="modal wz-modal">
    <h2>Discard this draft?</h2>
    <p class="text-sm" id="wz-discard-impact"></p>
    <div class="modal-actions">
      <button type="button" class="btn" data-action="modal-close">Keep draft</button>
      <button type="button" class="btn btn-danger" id="wz-discard-confirm" data-action="confirmDiscard">Discard draft</button>
    </div>
  </div>
</div>

<script nonce="{{$.CSPNonce}}" src="/static/cc-form.js"></script>
<script nonce="{{$.CSPNonce}}">
(function () {
'use strict';
var STEPS = [
  {title: 'Client', sub: 'Name and update policy'},
  {title: 'Credentials', sub: 'Key bundle'},
  {title: 'Control channel', sub: 'Optional'},
  {title: 'Install', sub: 'One-time command'}
];
var S = {
  step: 1, draft: null, name: '', policy: 'managed', suiteID: '', suites: [], suiteDetail: {}, gone: false,
  services: [], keys: [], drafts: [], ccs: [], cc: null,
  ccf: {agent: 'claude_code', sandbox: 'workspace-write', keyID: '', guildID: '', categoryID: '', setup: null, categories: [], check: null, loading: ''},
  token: '', reveal: false, saved: false, busy: false, err: '',
  gatewayURL: window.location.origin, gatewayOK: false, ready: false
};
var discardTarget = null;

function $(id) { return document.getElementById(id); }
function plural(n, one, many) { return n + ' ' + (n === 1 ? one : many); }
function api(method, url, body) {
  var opts = {method: method, credentials: 'same-origin'};
  if (body !== undefined) { opts.headers = {'Content-Type': 'application/json'}; opts.body = JSON.stringify(body); }
  return fetch(url, opts).then(function (r) {
    return r.text().then(function (t) {
      var d = null;
      try { d = t ? JSON.parse(t) : {}; } catch (e) { d = {}; }
      if (!r.ok) { var err = new Error((d && d.error) || ('request failed (' + r.status + ')')); err.status = r.status; err.data = d; throw err; }
      return d;
    });
  });
}
function keepFocus(fn) {
  var id = document.activeElement && document.activeElement.id;
  fn();
  if (id) { var el = $(id); if (el && el.focus) el.focus(); }
}

/* ---------- rendering ---------- */
function renderSteps() {
  var items = STEPS.map(function (s, i) {
    var n = i + 1, done = n < S.step, on = n === S.step;
    return DW.html`<li class="wz-step${on ? ' is-current' : ''}${done ? ' is-done' : ''}"${on ? DW.raw(' aria-current="step"') : ''}><span class="wz-dot" aria-hidden="true">${done ? '✓' : String(n)}</span><span class="wz-step-text"><span class="wz-step-title">${s.title}</span><span class="wz-step-sub">${s.sub}${done ? ' · done' : ''}</span></span></li>`;
  });
  DW.setHTML($('wz-steps'), DW.html`${items}`);
  $('wz-compact').textContent = 'Step ' + S.step + ' of 4 · ' + STEPS[S.step - 1].title;
}
function renderDraftNote() {
  var note = $('wz-draftnote'), btn = $('wz-discard-btn');
  if (S.token) { note.textContent = 'Client created'; btn.hidden = true; return; }
  if (S.draft) {
    note.textContent = 'Draft saved · resume any time from Clients';
    btn.hidden = false; btn.setAttribute('data-id', S.draft.id);
  } else {
    note.textContent = 'Not saved yet · saved when you create the client';
    btn.hidden = true;
  }
}
function errBox() {
  return S.err ? DW.html`<p class="wz-err" role="alert">${S.err}</p>` : DW.raw('<p class="wz-err" role="alert" hidden></p>');
}
function head(title, sub, optional) {
  return DW.html`<div class="wz-head"><h1 id="wz-title" class="wz-title" tabindex="-1">${title}${optional ? DW.html` <span class="wz-opt">optional</span>` : ''}</h1><p class="text-muted wz-sub">${sub}</p></div>`;
}

function step1() {
  return DW.html`${head('Name the client', 'A client is one machine or container running the duckway agent.')}
<div class="form-group"><label for="wz-name">Client name</label><input id="wz-name" type="text" value="${S.name}" maxlength="63" autocomplete="off" spellcheck="false" aria-describedby="wz-name-help" data-on-input="onName"><span class="text-sm text-muted" id="wz-name-help">Lowercase letters, digits and dashes. Shown in logs and approvals.</span></div>
<fieldset class="wz-field"><legend class="wz-legend">Updates</legend>
<label class="wz-opt-card"><input type="radio" name="wz-policy" value="managed" data-on-change="onPolicy"${S.policy === 'managed' ? DW.raw(' checked') : ''}><span><strong>Managed</strong><br><span class="text-sm text-muted">Joins fleet rollouts automatically.</span></span></label>
<label class="wz-opt-card"><input type="radio" name="wz-policy" value="manual" data-on-change="onPolicy"${S.policy === 'manual' ? DW.raw(' checked') : ''}><span><strong>Manual</strong><br><span class="text-sm text-muted">You update this machine yourself.</span></span></label>
</fieldset>${errBox()}`;
}

function suiteOptions() {
  var opts = [DW.html`<option value="">None for now</option>`];
  S.suites.forEach(function (s) {
    opts.push(DW.html`<option value="${s.id}"${s.id === S.suiteID ? DW.raw(' selected') : ''}>${s.name} (${plural(s.entry_count || 0, 'service', 'services')})</option>`);
  });
  return opts;
}
function entrySource(e) {
  if (e.group_name) return 'pool “' + e.group_name + '”';
  if (e.api_key_name) return 'credential “' + e.api_key_name + '”';
  return 'credential';
}
function bundlePreview() {
  if (!S.suiteID) return DW.raw('<p class="text-muted text-sm wz-nobundle">No bundle selected. No phantom tokens are created now. You can add single credentials from the client page later.</p>');
  var d = S.suiteDetail[S.suiteID];
  if (!d) return DW.raw('<p class="text-muted text-sm">Loading bundle&hellip;</p>');
  var entries = d.entries || [];
  if (!entries.length) return DW.raw('<p class="text-muted text-sm">This bundle has no entries yet, so no phantom tokens would be created.</p>');
  return DW.html`<div class="wz-preview"><div class="wz-preview-head">This creates ${plural(entries.length, 'phantom token', 'phantom tokens')}</div><ul class="wz-preview-list">${entries.map(function (e) {
    return DW.html`<li><span class="mono wz-env">${e.env_name}</span><span class="wz-src">${e.service_name || e.service_id} · ${entrySource(e)} · No approval</span></li>`;
  })}</ul><p class="text-muted text-sm">Bundles do not carry approval rules, so these tokens start with no approval required. Set approval per credential on the client page after setup.</p></div>`;
}
function step2() {
  return DW.html`${head('Give it credentials', 'Pick a key bundle to create its phantom tokens in one step. You can add single credentials later.')}
<div class="form-group"><label for="wz-suite">Key bundle</label><select id="wz-suite" data-on-change="onSuite">${suiteOptions()}</select></div>
<div id="wz-preview" aria-live="polite">${bundlePreview()}</div>${errBox()}`;
}

function discordService() { return S.services.filter(function (s) { return s.is_active && s.name === 'discord'; })[0] || null; }
function discordKeys() {
  var svc = discordService();
  return svc ? S.keys.filter(function (k) { return k.service_id === svc.id && k.is_active; }) : [];
}
function ccFields() {
  var f = S.ccf, F = DW.ccForm;
  var sandbox = f.agent === 'codex'
    ? F.sandboxField({id: 'wz-sandbox', value: f.sandbox, action: 'onCCField', hint: DW.raw('<span class="text-sm text-muted">Use danger-full-access only on trusted machines.</span>')})
    : '';
  var dest = '';
  if (f.keyID) {
    if (f.loading === 'setup') dest = DW.raw('<p class="text-muted text-sm" role="status">Loading servers&hellip;</p>');
    else if (f.setup && (f.setup.guilds || []).length) {
      dest = DW.html`${F.grid(DW.html`${F.serverField({id: 'wz-guild', label: 'Server', items: f.setup.guilds, value: f.guildID, action: 'onGuild'})}${F.categoryField({id: 'wz-category', label: 'Category', items: f.categories, value: f.categoryID, action: 'onCCField', leading: [{value: '__new__', label: '+ Create “' + S.name + '”'}]})}`)}${checkRow()}`;
    } else {
      var why = f.setup && f.setup.guilds_error ? 'Could not list servers: ' + f.setup.guilds_error : 'The bot is not in any server yet.';
      var invite = f.setup && f.setup.invite_url && /^https?:\/\//i.test(f.setup.invite_url) ? DW.html` <a href="${f.setup.invite_url}" target="_blank" rel="noopener">Invite the bot</a>` : '';
      dest = DW.html`<p class="text-muted text-sm">${why}${invite} <button type="button" class="ro-linkbtn" data-action="reloadSetup">Refresh servers</button></p>`;
    }
  }
  return DW.html`${F.grid(DW.html`${F.agentField({id: 'wz-agent', value: f.agent, action: 'onCCField'})}${F.credentialField({id: 'wz-bot', label: 'Discord bot', keys: discordKeys(), value: f.keyID, action: 'onBot', prompt: 'Select a bot credential'})}`)}${sandbox}${dest}`;
}
function checkRow() {
  return DW.ccForm.checkRow({rowId: 'wz-check', buttonId: 'wz-check-btn', skipped: S.ccf.categoryID === '__new__', check: S.ccf.check, checkAction: 'checkCC', grantAction: 'grantAccess'});
}
function step3() {
  var body;
  if (S.cc) {
    body = DW.html`<div class="wz-done-box"><span class="ro-pill ro-pill-ok">Created</span><span>Control channel “${S.cc.name}” is already set up for this client.</span></div>`;
  } else if (!discordService() || !discordKeys().length) {
    body = DW.raw('<p class="text-muted">No Discord bot credential is configured, so there is nothing to connect. Skip this step; you can add a control channel later.</p>');
  } else {
    body = DW.html`<div id="wz-cc-fields">${ccFields()}</div>`;
  }
  return DW.html`${head('Control channel', 'Drive this client’s agent from Discord. The bot token stays on the server.', true)}${body}<p class="text-sm text-muted">Next you get the install command with a one-time client token.</p>${errBox()}`;
}

function shq(s) { return "'" + String(s == null ? '' : s).replace(/'/g, "'\\''") + "'"; }
function installLines(masked) {
  var tok = masked ? '••••••••••••••••••••' : S.token;
  var lines = [
    'curl -fsSL ' + shq(S.gatewayURL.replace(/\/$/, '') + '/install.sh') + ' | sh',
    'printf \'%s\\n\' ' + shq(S.gatewayURL) + ' ' + shq(S.name) + ' 1 ' + shq(tok) + ' | duckway init',
    'duckway sync',
    'duckway proxy -d',
    'eval "$(duckway env)"',
    'duckway status'
  ];
  if (S.cc) lines.push('duckway cc watch -d');
  return lines;
}
function unitText() {
  var lines = [
    'mkdir -p ~/.config/systemd/user',
    '',
    "cat > ~/.config/systemd/user/duckway-proxy.service <<'EOF'",
    '[Unit]', 'Description=Duckway local API proxy', 'After=network-online.target', 'Wants=network-online.target', '',
    '[Service]', 'Type=simple', 'ExecStart=/usr/local/bin/duckway proxy', 'Restart=on-failure', 'RestartSec=5', 'Environment=HOME=%h', '',
    '[Install]', 'WantedBy=default.target', 'EOF', ''
  ];
  if (S.cc) {
    lines = lines.concat([
      "cat > ~/.config/systemd/user/duckway-cc-watch.service <<'EOF'",
      '[Unit]', 'Description=Duckway Control Channel watcher', 'After=network-online.target', 'Wants=network-online.target', '',
      '[Service]', 'Type=simple', 'ExecStart=/usr/local/bin/duckway cc watch', 'Restart=on-failure', 'RestartSec=5', 'Environment=HOME=%h', '',
      '[Install]', 'WantedBy=default.target', 'EOF', ''
    ]);
  }
  lines.push('systemctl --user daemon-reload', 'systemctl --user enable --now duckway-proxy');
  if (S.cc) lines.push('systemctl --user enable --now duckway-cc-watch');
  lines.push('', '# Optional: keep user services running after boot before login.', 'sudo loginctl enable-linger "$USER"');
  return lines.join('\n');
}
function step4() {
  var gw = S.gatewayOK ? '' : DW.html`<div class="wz-warn" role="alert"><strong>Gateway URL is not configured.</strong> Set Gateway URL in Settings first. In split mode the admin panel does not serve <code>/install.sh</code>.</div>`;
  return DW.html`${head('Install on the machine', 'Run this on ' + S.name + '. It contains a one-time client token.')}
<div class="wz-once"><span class="ro-pill ro-pill-warn">Once</span><span>The token is shown only on this screen. If you lose it, rotate the client token from the client’s Danger zone.</span></div>${gw}
<div class="wz-cmd"><pre class="mono wz-pre" id="wz-cmd-pre" tabindex="0" aria-label="Install command">${installLines(!S.reveal).join('\n')}</pre><div class="wz-cmd-btns"><button type="button" class="btn btn-sm" id="wz-reveal" data-action="toggleReveal" aria-pressed="${S.reveal ? 'true' : 'false'}">${S.reveal ? 'Hide token' : 'Show token'}</button><button type="button" class="btn btn-sm" id="wz-copy" data-action="copyCmd">Copy</button></div></div>
<details class="wz-details"><summary>Run as a systemd service</summary><div class="wz-details-body"><p class="text-sm text-muted">Run this on the client after the commands above. It creates user services that start the local proxy${S.cc ? ' and the control channel watcher' : ''} at login.</p><pre class="mono wz-pre">${unitText()}</pre></div></details>
<label class="wz-check-label"><input type="checkbox" id="wz-saved" data-on-change="onSaved"${S.saved ? DW.raw(' checked') : ''}><span>I’ve copied the command somewhere safe</span></label>${errBox()}`;
}

function footer() {
  var s = S.step, dis = S.busy ? DW.raw(' disabled') : '';
  var back = s > 1 && s < 4 ? DW.html`<button type="button" class="btn" data-action="goBack"${dis}>Back</button>` : '';
  var skip = s === 2 || s === 3 ? DW.html`<button type="button" class="btn" data-action="skipStep"${dis}>Skip this step</button>` : '';
  var label, off = S.busy;
  if (s === 1) label = S.draft ? 'Save and continue' : 'Create client';
  else if (s === 2) label = S.suiteID ? 'Assign bundle' : 'Continue';
  else if (s === 3) label = S.cc ? 'Continue' : 'Create channel';
  else { label = 'Finish'; off = off || !S.saved; }
  var hint = s === 4 && !S.saved ? DW.raw('<span class="text-sm text-muted wz-hint" id="wz-hint">Tick the box above to finish.</span>') : '';
  return DW.html`${back}<span class="wz-spacer"></span>${hint}${skip}<button type="button" class="btn btn-primary" id="wz-next" data-action="nextStep"${off ? DW.raw(' disabled') : ''}>${label}</button>`;
}
function render(focusTitle) {
  renderSteps(); renderDraftNote(); renderDraftList();
  var body = $('wz-body');
  if (S.gone) {
    DW.setHTML(body, DW.html`${head('This draft is no longer available', 'Its install token was already issued, or the draft was discarded.')}<p class="text-sm">If the client exists, rotate its token from the client page to get a new install command.</p><p><a class="btn btn-primary" href="/admin/clients">Open Clients</a> <a class="btn" href="/admin/clients/new">Start a new client</a></p>`);
    DW.setHTML($('wz-foot'), DW.raw(''));
    return;
  }
  var fn = [step1, step2, step3, step4][S.step - 1];
  DW.setHTML(body, fn());
  DW.setHTML($('wz-foot'), footer());
  if (focusTitle) { var t = $('wz-title'); if (t) t.focus(); }
}
function setErr(msg) { S.err = msg || ''; var e = document.querySelector('#wz-body .wz-err'); if (e) { e.textContent = S.err; e.hidden = !S.err; } }
function setBusy(b) { S.busy = b; DW.setHTML($('wz-foot'), footer()); }

/* ---------- step logic ---------- */
function goto_(n) { S.step = n; S.err = ''; render(true); if (n === 2) ensureSuiteDetail(); if (n === 3) maybeLoadSetup(); }
function saveStep(extra) {
  var body = {step: S.step};
  Object.keys(extra || {}).forEach(function (k) { body[k] = extra[k]; });
  return api('PATCH', '/api/client-drafts/' + encodeURIComponent(S.draft.id), body).then(function (d) { S.draft = d; });
}
function nextStep1() {
  var name = S.name.trim();
  if (!/^[a-z0-9][a-z0-9-]{0,62}$/.test(name)) { setErr('Use lowercase letters, digits and dashes (start with a letter or digit).'); $('wz-name').focus(); return Promise.resolve(); }
  setBusy(true);
  var p;
  if (!S.draft) p = api('POST', '/api/client-drafts', {name: name, update_policy: S.policy}).then(function (d) { S.draft = d; history.replaceState(null, '', '/admin/clients/new?draft=' + encodeURIComponent(d.id)); });
  else p = api('PATCH', '/api/client-drafts/' + encodeURIComponent(S.draft.id), {name: name, update_policy: S.policy, step: Math.max(2, S.draft.step)}).then(function (d) { S.draft = d; });
  return p.then(function () { S.name = name; return saveStep({step: 2}); }).then(function () { setBusy(false); goto_(2); })
    .catch(function (e) { setBusy(false); setErr(e.message); });
}
function ensureSuiteDetail() {
  var id = S.suiteID;
  if (!id || S.suiteDetail[id]) return;
  api('GET', '/api/key-suites/' + encodeURIComponent(id)).then(function (d) { S.suiteDetail[id] = d; if (S.step === 2 && S.suiteID === id) DW.setHTML($('wz-preview'), bundlePreview()); })
    .catch(function (e) { setErr('Could not load the bundle: ' + e.message); });
}
function nextStep2(skip) {
  var target = skip ? '' : S.suiteID;
  var current = S.draft.suite_id || '';
  setBusy(true);
  var p = Promise.resolve();
  if (target !== current) {
    if (current) p = p.then(function () { return api('DELETE', '/api/key-suites/' + encodeURIComponent(current) + '/assignments/' + encodeURIComponent(S.draft.id)).catch(function (e) { if (e.status !== 404) throw e; }); });
    if (target) p = p.then(function () { return api('POST', '/api/key-suites/' + encodeURIComponent(target) + '/assign', {client_id: S.draft.id}); })
      .then(function (res) { if (res && res.skipped && res.skipped.length) DW.toast('Assigned with ' + plural(res.skipped.length, 'conflict', 'conflicts') + ' skipped'); });
  }
  return p.then(function () { S.suiteID = target; return saveStep({step: 3, suite_id: target}); })
    .then(function () { setBusy(false); goto_(3); })
    .catch(function (e) { setBusy(false); setErr(e.message); });
}
function renderCC() {
  if (S.step !== 3 || !$('wz-cc-fields')) return;
  keepFocus(function () { DW.setHTML($('wz-cc-fields'), ccFields()); });
}
function maybeLoadSetup() {
  var f = S.ccf;
  if (!f.keyID || S.cc) return;
  if (f.setup && f.setup.keyID === f.keyID) return;
  loadSetup();
}
function loadSetup() {
  var f = S.ccf, keyID = f.keyID;
  f.loading = 'setup'; f.setup = null; f.categories = []; f.guildID = ''; f.categoryID = '__new__'; f.check = null;
  renderCC();
  return api('GET', '/api/cc/discord/setup?api_key_id=' + encodeURIComponent(keyID)).then(function (d) {
    if (f.keyID !== keyID) return;
    f.setup = {keyID: keyID, bot: d.bot, invite_url: d.invite_url, guilds: d.guilds || [], guilds_error: d.guilds_error || ''};
    f.loading = '';
    if (f.setup.guilds.length) { f.guildID = f.setup.guilds[0].id; return loadCategories(); }
    renderCC();
  }).catch(function (e) {
    if (f.keyID !== keyID) return;
    f.loading = ''; f.setup = {keyID: keyID, guilds: [], guilds_error: e.message};
    renderCC();
  });
}
function loadCategories() {
  var f = S.ccf, keyID = f.keyID, guildID = f.guildID;
  return api('GET', '/api/cc/discord/categories?api_key_id=' + encodeURIComponent(keyID) + '&guild_id=' + encodeURIComponent(guildID)).then(function (d) {
    if (f.keyID !== keyID || f.guildID !== guildID) return;
    f.categories = d.categories || []; f.categoryID = '__new__'; f.check = null;
  }).catch(function (e) { f.categories = []; DW.toast(e.message, 'error'); })
    .then(function () { renderCC(); });
}
function runCheck() {
  var f = S.ccf;
  if (!f.keyID || !f.guildID || !f.categoryID || f.categoryID === '__new__') return Promise.resolve();
  var k = f.keyID, g = f.guildID, c = f.categoryID;
  var stale = function () { return f.keyID !== k || f.guildID !== g || f.categoryID !== c; };
  f.check = {busy: true};
  renderCC();
  return api('POST', '/api/cc/discord/preflight', {api_key_id: k, guild_id: g, category_id: c}).then(function (d) {
    if (stale()) return;
    f.check = {ok: !!d.ok, steps: d.steps || []};
  }).catch(function (e) { if (stale()) return; f.check = {ok: false, error: e.message}; })
    .then(function () { renderCC(); });
}
function nextStep3(skip) {
  if (skip || S.cc) return issue();
  var f = S.ccf;
  if (!f.keyID || !f.guildID || !f.categoryID) { setErr('Choose a Discord bot, server and category, or skip this step.'); return Promise.resolve(); }
  var svc = discordService();
  setBusy(true);
  var catP = f.categoryID === '__new__'
    ? (f.created && f.created.key === f.keyID && f.created.guild === f.guildID && f.created.name === S.name
      ? Promise.resolve(f.created.id)
      : api('POST', '/api/cc/discord/categories', {api_key_id: f.keyID, guild_id: f.guildID, name: S.name}).then(function (d) {
        if (d.permission_warning) DW.toast(d.permission_warning, 'error');
        f.created = {key: f.keyID, guild: f.guildID, name: S.name, id: d.id};
        return d.id;
      }))
    : Promise.resolve(f.categoryID);
  return catP.then(function (catID) {
    var cfg = {guild_id: f.guildID, category_id: catID};
    if (f.agent === 'codex') cfg.agent_options = {sandbox: f.sandbox};
    return api('POST', '/api/cc', {name: S.name + ' CC', client_id: S.draft.id, service_id: svc.id, api_key_id: f.keyID, agent_type: f.agent, config: cfg});
  }).then(function (cc) { S.cc = cc; return issue(true); })
    .catch(function (e) { setBusy(false); setErr(e.message); });
}
function issue(alreadyBusy) {
  if (!alreadyBusy) setBusy(true);
  return api('POST', '/api/client-drafts/' + encodeURIComponent(S.draft.id) + '/issue-token').then(function (d) {
    S.token = d.token; S.name = d.name; S.saved = false; S.reveal = false;
    S.busy = false; S.step = 4; S.err = '';
    history.replaceState(null, '', '/admin/clients/new');
    render(true);
  }).catch(function (e) { setBusy(false); setErr(e.message); });
}
function finish() { window.location.href = '/admin/clients'; }

function copyText(text) {
  if (navigator.clipboard && navigator.clipboard.writeText && window.isSecureContext) return navigator.clipboard.writeText(text);
  return new Promise(function (resolve, reject) {
    var ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', ''); ta.className = 'wz-offscreen';
    document.body.appendChild(ta); ta.select();
    var ok = false;
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    ta.remove();
    if (ok) resolve(); else reject(new Error('copy blocked'));
  });
}

/* ---------- discard ---------- */
function askDiscard(id, name) {
  discardTarget = {id: id, name: name};
  var parts = [];
  if (S.draft && S.draft.id === id) {
    if (S.suiteID) parts.push('the phantom tokens created from its key bundle');
    if (S.cc) parts.push('its control channel');
  }
  $('wz-discard-impact').textContent = '“' + name + '” has no token yet and cannot connect. Discarding deletes the draft client' + (parts.length ? ', ' + parts.join(' and ') : '') + '.';
  DW.modal.open('#wz-discard-modal');
}
function confirmDiscard() {
  var t = discardTarget; discardTarget = null;
  DW.modal.close('#wz-discard-modal');
  if (!t) return;
  return api('DELETE', '/api/client-drafts/' + encodeURIComponent(t.id)).then(function () {
    DW.toast('Draft discarded', 'success');
    if (S.draft && S.draft.id === t.id) { window.location.href = '/admin/clients'; return; }
    S.drafts = S.drafts.filter(function (d) { return d.id !== t.id; });
    renderDraftList();
  }).catch(function (e) { DW.toast(e.message, 'error'); });
}
function renderDraftList() {
  var box = $('wz-resume');
  if (!S.drafts.length || S.draft) { box.hidden = true; return; }
  box.hidden = false;
  DW.setHTML($('wz-resume-list'), DW.html`${S.drafts.map(function (d) {
    return DW.html`<li class="wz-draft"><span class="wz-draft-name">${d.name}</span><span class="text-sm text-muted">Step ${d.step} of 4 · saved ${d.updated_at}</span><a class="btn btn-sm" href="/admin/clients/new?draft=${encodeURIComponent(d.id)}">Resume</a><button type="button" class="btn btn-sm ro-danger" data-action="askDiscard" data-id="${d.id}" data-name="${d.name}">Discard</button></li>`;
  })}`);
}

/* ---------- actions ---------- */
DW.actions.onName = function (el) { S.name = el.value; };
DW.actions.onPolicy = function (el) { S.policy = el.value; };
DW.actions.onSuite = function (el) { S.suiteID = el.value; setErr(''); DW.setHTML($('wz-preview'), bundlePreview()); DW.setHTML($('wz-foot'), footer()); ensureSuiteDetail(); };
DW.actions.onBot = function (el) { S.ccf.keyID = el.value; S.ccf.setup = null; S.ccf.check = null; S.ccf.guildID = ''; S.ccf.categoryID = ''; S.ccf.categories = []; if (el.value) return loadSetup(); renderCC(); };
DW.actions.onGuild = function (el) { S.ccf.guildID = el.value; S.ccf.check = null; return loadCategories(); };
DW.actions.onCCField = function (el) {
  var f = S.ccf;
  if (el.id === 'wz-agent') f.agent = el.value;
  else if (el.id === 'wz-sandbox') f.sandbox = el.value;
  else if (el.id === 'wz-category') { f.categoryID = el.value; f.check = null; }
  renderCC();
};
DW.actions.reloadSetup = function () { S.ccf.setup = null; return loadSetup(); };
DW.actions.checkCC = function () { return runCheck(); };
DW.actions.grantAccess = function () {
  var f = S.ccf;
  return api('POST', '/api/cc/discord/category-permissions', {api_key_id: f.keyID, category_id: f.categoryID}).then(function () { DW.toast('Bot access granted', 'success'); return runCheck(); })
    .catch(function (e) { DW.toast(e.message, 'error'); });
};
DW.actions.goBack = function () { if (S.step > 1 && S.step < 4) goto_(S.step - 1); };
DW.actions.skipStep = function () { if (S.step === 2) return nextStep2(true); if (S.step === 3) return nextStep3(true); };
DW.actions.nextStep = function () {
  if (S.busy) return;
  if (S.step === 1) return nextStep1();
  if (S.step === 2) return nextStep2(false);
  if (S.step === 3) return nextStep3(false);
  if (S.step === 4 && S.saved) return finish();
};
DW.actions.toggleReveal = function () { S.reveal = !S.reveal; keepFocus(function () { DW.setHTML($('wz-body'), step4()); }); };
DW.actions.copyCmd = function (el) {
  return copyText(installLines(false).join('\n')).then(function () {
    DW.toast('Install command copied', 'success');
    el.textContent = 'Copied';
    setTimeout(function () { if (el.isConnected) el.textContent = 'Copy'; }, 2000);
  }).catch(function () { DW.toast('Copy was blocked. Show the token and select the command manually.', 'error'); });
};
DW.actions.onSaved = function (el) { S.saved = el.checked; DW.setHTML($('wz-foot'), footer()); };
DW.actions.askDiscard = function (el) { askDiscard(el.getAttribute('data-id'), el.getAttribute('data-name') || (S.draft && S.draft.name) || 'this client'); };
DW.actions.confirmDiscard = function () { return confirmDiscard(); };

window.addEventListener('beforeunload', function (e) {
  if (S.token && !S.saved) { e.preventDefault(); e.returnValue = ''; }
});

/* ---------- init ---------- */
function loadGateway() {
  return api('GET', '/api/settings').then(function (s) {
    if (s.gateway_url) { S.gatewayURL = s.gateway_url; S.gatewayOK = true; return; }
    return fetch('/install.sh', {method: 'HEAD'}).then(function (r) { S.gatewayOK = !!r.ok; }).catch(function () { S.gatewayOK = false; });
  }).catch(function () { S.gatewayOK = false; });
}
function applyDraft(d) {
  S.draft = d; S.name = d.name; S.policy = d.update_policy || 'managed'; S.suiteID = d.suite_id || '';
  S.step = Math.min(3, Math.max(1, d.step || 1));
  S.cc = S.ccs.filter(function (c) { return c.client_id === d.id; })[0] || null;
}
function init() {
  var want = new URLSearchParams(window.location.search).get('draft');
  Promise.all([
    api('GET', '/api/key-suites').then(function (d) { S.suites = d || []; }).catch(function () {}),
    api('GET', '/api/services').then(function (d) { S.services = d || []; }).catch(function () {}),
    api('GET', '/api/keys').then(function (d) { S.keys = d || []; }).catch(function () {}),
    api('GET', '/api/cc').then(function (d) { S.ccs = d || []; }).catch(function () {}),
    api('GET', '/api/client-drafts').then(function (d) { S.drafts = d || []; }).catch(function () {}),
    loadGateway()
  ]).then(function () {
    if (want) {
      var d = S.drafts.filter(function (x) { return x.id === want; })[0];
      if (d) applyDraft(d); else S.gone = true;
    }
    S.ready = true;
    renderDraftList();
    render(false);
    if (S.step === 2) ensureSuiteDetail();
    if (S.step === 3) maybeLoadSetup();
  });
}
document.addEventListener('DOMContentLoaded', init);
})();
</script>
{{end}}

# Test: Claude Code with Duckway-managed .credentials.json
#
# Fetches phantom OAuth credentials from the Duckway server and mounts
# them as ~/.claude/.credentials.json so Claude uses the phantom tokens.
# Use this to manually verify the credential flow works.
#
# Usage:
#   # 1. Duckway server must be running
#   docker compose --profile combined up -d
#
#   # 2. Set your client token (from admin panel → Clients)
#   #    The client must have a refreshable Anthropic token assigned.
#   export DUCKWAY_CLIENT_TOKEN=<your-client-token>
#
#   # 3. Start
#   docker compose -f examples/docker-compose.claude-test.yml up -d
#
#   # 4. Check credentials were fetched
#   docker exec claude-test cat /home/claude/.claude/.credentials.json
#
#   # 5. Use Claude interactively
#   docker exec -it claude-test claude
#
# Notes:
#   - The init container fetches credentials from the server on startup
#   - Claude sees phantom tokens that look like real OAuth tokens
#   - Without a duckway proxy, Claude will send phantom tokens directly
#     to Anthropic (which will reject them) — this is expected for testing
#     the credential format. For full E2E, use docker-compose.claude.yml.

services:
  # Fetch phantom .credentials.json from Duckway server
  init:
    image: alpine:3.21
    container_name: claude-test-init
    networks:
      - duckway_default
    environment:
      - DUCKWAY_GATEWAY=${DUCKWAY_GATEWAY:-http://duckway-server:8080}
      - DUCKWAY_CLIENT_TOKEN=${DUCKWAY_CLIENT_TOKEN}
    volumes:
      - claude-home:/home/claude
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        apk add --no-cache curl >/dev/null 2>&1
        mkdir -p /home/claude/.claude

        apk add --no-cache jq >/dev/null 2>&1 || true

        # 1. Fetch full response (credentials + config)
        echo "Fetching phantom credentials..."
        curl -sf \
          -H "X-Duckway-Token: $$DUCKWAY_CLIENT_TOKEN" \
          "$$DUCKWAY_GATEWAY/client/claude-credentials" \
          -o /tmp/response.json

        if [ ! -s /tmp/response.json ]; then
          echo "Failed to fetch credentials"
          echo "Check: DUCKWAY_CLIENT_TOKEN is set and client has a refreshable Anthropic token assigned"
          exit 1
        fi

        # 2. Extract .credentials.json (claudeAiOauth only, always overwrite)
        jq '{claudeAiOauth: .claudeAiOauth}' /tmp/response.json \
          > /home/claude/.claude/.credentials.json
        echo "Written ~/.claude/.credentials.json"

        # 3. Extract .claude.json from server response (always overwrite — server controls display)
        if jq -e '.claudeConfig' /tmp/response.json >/dev/null 2>&1; then
          jq '.claudeConfig' /tmp/response.json > /home/claude/.claude.json
          echo "Written ~/.claude.json (from server)"
        elif [ ! -f /home/claude/.claude.json ]; then
          printf '{\n  "hasCompletedOnboarding": true,\n  "lastOnboardingVersion": "2.1.119"\n}\n' \
            > /home/claude/.claude.json
          echo "Written ~/.claude.json (defaults)"
        fi

        # 4. Default settings (don't overwrite if exists — user may customize)
        if [ ! -f /home/claude/.claude/settings.json ]; then
          printf '{\n  "theme": "dark"\n}\n' \
            > /home/claude/.claude/settings.json
          echo "Written ~/.claude/settings.json (defaults)"
        fi

        # 5. Fetch Duckway CA cert so Node.js trusts the MITM proxy if user
        #    later adds HTTPS_PROXY in front. Stored alongside the Claude home.
        curl -sf "$$DUCKWAY_GATEWAY/skill/ca.pem" \
          -o /home/claude/.duckway-ca.pem 2>/dev/null && \
          echo "Fetched Duckway CA → /home/claude/.duckway-ca.pem (set NODE_EXTRA_CA_CERTS to use it)"

        rm -f /tmp/response.json
        echo ""
        echo "=== ~/.claude/.credentials.json ==="
        cat /home/claude/.claude/.credentials.json
        echo ""
        echo "=== ~/.claude.json ==="
        cat /home/claude/.claude.json
        echo ""

  # Claude Code with mounted credentials
  claude:
    image: node:22-alpine
    container_name: claude-test
    depends_on:
      init:
        condition: service_completed_successfully
    environment:
      - HOME=/home/claude
      # Trust the Duckway CA in case user routes through the MITM proxy.
      # Harmless even when no proxy is configured — Node still trusts public CAs.
      - NODE_EXTRA_CA_CERTS=/home/claude/.duckway-ca.pem
    volumes:
      - claude-home:/home/claude
      - ${WORKSPACE_DIR:-/tmp/claude-workspace}:/workspace
    working_dir: /workspace
    entrypoint: /bin/sh
    command:
      - -c
      - |
        set -e
        if ! command -v claude >/dev/null 2>&1; then
          echo "Installing Claude Code..."
          npm install -g @anthropic-ai/claude-code
        fi

        echo ""
        echo "========================================"
        echo "  Credentials mounted:"
        echo "  $$(cat /home/claude/.claude/.credentials.json | head -1)"
        echo ""
        echo "  docker exec -it claude-test claude"
        echo "========================================"
        echo ""
        sleep infinity

volumes:
  claude-home:

networks:
  duckway_default:
    external: true
